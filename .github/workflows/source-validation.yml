name: Source validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Source-only review checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: |
          npm run verify:review
          npm run verify:portability
          npm run test:managed-source-mock

      - name: Explain the full source gate
        if: always()
        run: |
          {
            echo '### Full source gate'
            echo
            echo 'The clean-checkout contract compile and workspace suite are run with the pinned Compact toolchain on a development host:'
            echo
            echo '```bash'
            echo 'npm ci'
            echo 'npm run verify:source'
            echo '```'
            echo
            echo 'This GitHub-hosted job intentionally runs the toolchain-independent review boundary, portability, and deterministic mock-source checks.'
          } >> "$GITHUB_STEP_SUMMARY"
