  </defs>

  <rect width="1672" height="941" fill="#06111F"/>
  <rect width="1672" height="941" fill="url(#grid)"/>
  <path d="M0 24H1672" stroke="#A66CFF" stroke-width="5"/>
  <text x="48" y="76" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="43" font-weight="800">システム全体とCloudflareリソースの関係</text>
  <text x="49" y="112" fill="#AAB7C8" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">センサー値を公開せず、しきい値判定だけを第三者が確認する</text>

  <!-- Edge Device -->
  <rect x="45" y="210" width="270" height="430" rx="22" fill="#0D2131" stroke="#38D6E8" stroke-width="4"/>
  <g transform="translate(135 245)" fill="none" stroke="#38D6E8" stroke-width="4"><rect x="0" y="20" width="78" height="56" rx="8"/><path d="M16 20V2M62 20V2M25 62h28"/><circle cx="20" cy="49" r="4" fill="#38D6E8"/><circle cx="58" cy="49" r="4" fill="#38D6E8"/></g>
  <text x="180" y="376" text-anchor="middle" fill="#38D6E8" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="29" font-weight="900">エッジデバイス</text>
  <text x="180" y="426" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">収集・1時間集約</text>
  <text x="180" y="461" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">認証・署名</text>
  <rect x="78" y="522" width="204" height="48" rx="22" fill="#112B35"/>
  <text x="180" y="553" text-anchor="middle" fill="#79D66A" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="17" font-weight="800">生の値を保持</text>

  <!-- Cloudflare boundary -->
  <rect x="370" y="145" width="900" height="635" rx="24" fill="#0A1625" stroke="#F6821F" stroke-width="4" stroke-dasharray="13 9"/>
  <rect x="400" y="125" width="330" height="48" rx="23" fill="#F6821F"/>
  <text x="565" y="157" text-anchor="middle" fill="#08111D" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22" font-weight="900">CLOUDFLARE リソース</text>

  <!-- Workers -->
  <rect x="410" y="205" width="290" height="180" rx="17" fill="#141E2C" stroke="#F6821F" stroke-width="3"/>
  <use href="#cf-workers" x="444" y="234" width="65" height="66" color="#F6821F"/>
  <text x="530" y="264" fill="#F6A35B" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="30" font-weight="900">Workers</text>
  <text x="555" y="327" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">API・認証・画面</text>

  <!-- D1 -->
  <rect x="410" y="440" width="240" height="175" rx="17" fill="#141E2C" stroke="#F6821F" stroke-width="3"/>
  <use href="#cf-d1" x="437" y="469" width="59" height="58" color="#F6821F"/>
  <text x="512" y="501" fill="#F6A35B" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="30" font-weight="900">D1</text>
  <text x="530" y="562" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="17">運用状態・表示用複製</text>

  <!-- Queues -->
  <rect x="675" y="440" width="240" height="175" rx="17" fill="#141E2C" stroke="#F6821F" stroke-width="3"/>
  <use href="#cf-queues" x="704" y="473" width="58" height="58" color="#F6821F"/>
  <text x="779" y="502" fill="#F6A35B" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="27" font-weight="900">Queues</text>
  <text x="795" y="562" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="17">証明依頼・再試行</text>

  <!-- Containers -->
  <rect x="950" y="205" width="280" height="410" rx="18" fill="#141E2C" stroke="#F6821F" stroke-width="3"/>
  <use href="#cf-containers" x="981" y="234" width="73" height="73" color="#F6821F"/>
  <text x="1074" y="266" fill="#F6A35B" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="27" font-weight="900">Containers</text>
  <rect x="980" y="335" width="220" height="92" rx="12" fill="#1A2637"/>
  <text x="1090" y="372" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="800">Proof Server</text>
  <text x="1090" y="402" text-anchor="middle" fill="#F4B740" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="16">証明生成</text>
  <rect x="980" y="455" width="220" height="112" rx="12" fill="#1A2637"/>
  <text x="1090" y="493" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18" font-weight="800">Sponsor Wallet</text>
  <text x="1090" y="526" text-anchor="middle" fill="#A66CFF" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="16">Fee追加・送信</text>

  <!-- R2 -->
  <rect x="950" y="645" width="280" height="70" rx="14" fill="#141E2C" stroke="#F6821F" stroke-width="2.5"/>
  <use href="#cf-r2" x="970" y="660" width="41" height="41" color="#F6821F"/>
  <text x="1028" y="674" fill="#F6A35B" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="22" font-weight="900">R2</text>
  <text x="1028" y="699" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13">暗号化Wallet同期だけ</text>

  <!-- Midnight -->
  <rect x="1330" y="220" width="290" height="410" rx="22" fill="#17152E" stroke="#A66CFF" stroke-width="4"/>
  <g transform="translate(1430 249)" fill="none" stroke="#A66CFF" stroke-width="4"><path d="M51 8a48 48 0 1 0 27 87A41 41 0 0 1 51 8Z"/><path d="M80 17l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#A66CFF"/></g>
  <text x="1475" y="385" text-anchor="middle" fill="#A66CFF" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="34" font-weight="900">MIDNIGHT</text>
  <text x="1475" y="458" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">しきい値・対象</text>
  <text x="1475" y="512" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="18">判定・取引記録</text>

  <!-- Public view -->
  <rect x="1330" y="674" width="290" height="105" rx="16" fill="#111C2C" stroke="#38D6E8" stroke-width="3"/>
  <text x="1475" y="713" text-anchor="middle" fill="#38D6E8" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="21" font-weight="900">第三者画面</text>
  <text x="1475" y="751" text-anchor="middle" fill="#F5F7FB" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="16">日付・しきい値・判定</text>

  <!-- Relations -->
  <path d="M315 310H410" fill="none" stroke="#38D6E8" stroke-width="4" marker-end="url(#blue-arrow)"/>

  <path d="M315 405H350V187H1090V335" fill="none" stroke="#F4B740" stroke-width="4" marker-end="url(#amber-arrow)"/>
  <rect x="675" y="171" width="330" height="34" rx="8" fill="#2B2515" stroke="#F4B740"/>
  <text x="840" y="194" text-anchor="middle" fill="#F4B740" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" font-weight="800">非公開MIN / MAX：証明中だけ</text>

  <path d="M555 385V440" fill="none" stroke="#38D6E8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <path d="M700 315H795V440" fill="none" stroke="#38D6E8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <path d="M915 528H950" fill="none" stroke="#38D6E8" stroke-width="3" marker-end="url(#blue-arrow)"/>

  <path d="M315 535H350V745H930V520H980" fill="none" stroke="#A66CFF" stroke-width="4" marker-end="url(#purple-arrow)"/>
  <rect x="470" y="728" width="345" height="34" rx="8" fill="#211832" stroke="#A66CFF"/>
  <text x="642" y="751" text-anchor="middle" fill="#A66CFF" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="13" font-weight="800">デバイス署名済み取引</text>

  <path d="M1200 520H1330" fill="none" stroke="#A66CFF" stroke-width="4" marker-end="url(#purple-arrow)"/>

  <path d="M1330 595H1270V635H530V615" fill="none" stroke="#79D66A" stroke-width="4" marker-end="url(#green-arrow)"/>

  <path d="M700 350H1288V726H1330" fill="none" stroke="#38D6E8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue-arrow)"/>

  <!-- Bottom message -->
  <rect x="45" y="824" width="1575" height="75" rx="15" fill="#091624" stroke="#29415C" stroke-width="2"/>
  <text x="832" y="870" text-anchor="middle" fill="#F4B740" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="21" font-weight="900">非公開MIN / MAXは D1・Queues・R2へ保存しない</text>
  <text x="1588" y="858" text-anchor="end" fill="#AAB7C8" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="10">Cloudflare公式製品アイコン使用</text>
  <text x="1588" y="883" text-anchor="end" fill="#AAB7C8" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="10">詳細は system_architecture.md</text>
</svg>
